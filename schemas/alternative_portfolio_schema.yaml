# Alternative Portfolio Proposal Schema
# Version: 1.0 | Effective: 2026-05-13
#
# All alternative portfolios must be submitted via this schema and approved
# by the three-member committee (CIO + Learning Coordinator + Risk & Dissent Coordinator).
# See constitution/fund_constitution.md Article VIII for governance rules.

proposal_schema:
  id:
    type: string
    format: "ALT-{8-char-hex-upper}"
    auto_generated: true
    description: "Unique portfolio identifier. Auto-generated by alternative_portfolio_engine.py"

  name:
    type: string
    required: true
    max_length: 60
    description: "Short descriptive name. Must be unique in the registry."
    examples:
      - "Aggressive Scarcity"
      - "Stagflation Hedge"
      - "AI Infrastructure Pure Play"

  thesis:
    type: string
    required: true
    min_length: 50
    description: >
      The differentiated worldview this portfolio represents.
      Must explain WHY this view exists and WHY it deserves a dedicated portfolio.
      Not just a list of assets — the underlying investment hypothesis.
    bad_example: "Holds gold and uranium."
    good_example: >
      Concentrated bet that real assets with fixed supply outperform in an inflationary regime
      driven by fiscal dominance. Gold provides monetary hedge; uranium provides energy transition
      scarcity. Neither are correlated with tech cycles, which dominate the main CIO portfolio.

  differentiation:
    type: string
    required: true
    description: >
      How this portfolio differs meaningfully from the main CIO portfolio.
      Must quantify the key weight differences and explain why those differences matter.
    validation: weight_overlap_with_cio < 0.85

  intended_regime:
    type: string
    required: true
    allowed_values:
      - bull
      - bear
      - sideways
      - stagflation
      - liquidity_crisis
      - risk_off
      - reflation
      - any
    description: >
      The market regime where this portfolio is expected to outperform the CIO.
      Critical for regime-conditional attribution analysis.

  expected_failure_mode:
    type: string
    required: true
    description: >
      Specific conditions under which this portfolio would meaningfully underperform.
      This must be honest and detailed — not a throwaway "it might lose money."
    examples:
      - "Deflationary bust: all risk assets correlate to 1. Gold holds, but BTC proxy collapses."
      - "Fed pivot drives tech rally: zero scarcity exposure means this badly trails QQQ."

  benchmark_relevance:
    type: string
    required: true
    description: >
      What specific benchmark question does this portfolio help answer?
      Examples: "Does scarcity concentration beat equity diversification over 3 years?"
      "What is the opportunity cost of full defensiveness vs staying invested?"

  why_deserves_tracking:
    type: string
    required: true
    description: >
      Justification for consuming one of the limited tracking slots (max 15 active).
      Must explain the learning value this portfolio provides to the organization.

  review_cadence:
    type: string
    required: true
    allowed_values:
      - weekly
      - monthly
      - quarterly
    description: >
      How frequently this portfolio's tracking should be reviewed.
      Use quarterly for long-horizon structural portfolios.
      Use weekly only for tactical portfolios with short-duration theses.

  category:
    type: string
    required: true
    allowed_values:
      - regime             # Designed for a specific market regime
      - tactical           # Short-duration opportunity (weeks to months)
      - structural         # Multi-year structural change thesis
      - concentrated_thesis # Concentrated single-idea bet
      - contrarian         # Against current consensus
      - macro_defensive    # Capital preservation focus
      - experimental       # AI-generated or novel hypothesis, high uncertainty
      - hybrid             # Combines multiple approaches explicitly
    description: "Portfolio type. Flexible — do not force into preset themes."

  weights:
    type: object
    required: true
    description: "Asset allocation as ticker: weight (decimal). Must sum to 1.0 ± 0.01."
    validation:
      sum_to_one: true
      tolerance: 0.01
      no_negative_weights: true
      tickers_must_have_public_price_data: true
    examples:
      valid:
        MSTR: 0.30
        GLD: 0.25
        URNM: 0.20
        IBIT: 0.15
        XLE: 0.10
      invalid_sum:
        SPY: 0.60
        GLD: 0.50  # sums to 1.10

  proposed_by:
    type: string
    required: true
    description: "Agent name or 'human_investor' for the proposing party."

  retirement_criteria:
    type: string
    required: true
    description: >
      Specific conditions that would trigger retirement of this portfolio.
      Must be measurable. Do not write 'if it stops working' — that is not a criterion.
    examples:
      - "If BTC scarcity thesis is invalidated (sustained ETF outflows 4+ weeks + hash rate collapse)."
      - "If this portfolio trails CIO by >20% over any 12-month rolling period."
      - "If AI structural change thesis is invalidated by AI compute commoditization."

# Anti-bias validation rules (enforced by alternative_portfolio_engine.py)
validation_rules:
  max_active_portfolios: 15
  max_weight_overlap_with_cio: 0.85       # >85% overlap = too similar
  max_weight_overlap_with_existing: 0.90  # >90% overlap with any active alternative = duplicate
  min_thesis_length_chars: 50
  all_three_approvers_required: true
  approvers:
    - cio
    - learning_coordinator
    - risk_dissent_coordinator

# Selection bias prevention rules (enforced by governance)
anti_bias_rules:
  no_recent_winner_chasing: >
    A portfolio may NOT be proposed primarily because it recently outperformed.
    Proposals must be justified by thesis quality, not trailing performance.

  no_tiny_variations: >
    A portfolio that differs from an existing one by only 1-2 tickers with small weight changes
    will be rejected as a tiny variation. The differentiation must be meaningful.

  no_recursive_winner_selection: >
    The Learning Coordinator must flag if 3+ recent proposals are converging on the same
    recent outperformer. This is a selection bias signal.

  no_overfitting_to_recent_regimes: >
    A portfolio proposed explicitly because "the last 6 months favored X" will receive
    additional scrutiny from the Risk & Dissent Coordinator.

# Learning principles (enforced by portfolio_intelligence.py)
learning_rules:
  min_observations_for_conclusion: 10
  outperformance_review_trigger_days: 90
  conservative_default: >
    When in doubt, observations are labeled "tentative" not "conclusive."
    Tentative signals inform monitoring, not action.
  regime_conditioning_required: >
    All performance comparisons must be regime-conditional.
    A portfolio that only outperforms in bull markets is not universally superior.
  why_before_what: >
    Understanding WHY a portfolio outperformed is required before the Learning Coordinator
    can propose any changes to the CIO's allocation based on alternative portfolio performance.
